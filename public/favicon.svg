<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#2C1810"/>
  <!-- Hawk body - geometric silhouette facing right -->
  <g transform="translate(16, 16)">
    <!-- Wing (spread, upper) -->
    <path d="M-4,-2 Q-8,-8 -2,-10 Q2,-8 0,-4 Z" fill="#C9A96E"/>
    <!-- Wing (spread, lower) -->
    <path d="M-4,-1 Q-10,-2 -10,4 Q-6,2 -2,0 Z" fill="#B8954F"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#C9A96E"/>
    <!-- Head -->
    <circle cx="4" cy="-2" r="2.5" fill="#C9A96E"/>
    <!-- Beak -->
    <path d="M6,-2.5 L9,-2 L6,-1.5 Z" fill="#B8954F"/>
    <!-- Eye -->
    <circle cx="4.8" cy="-2.5" r="0.6" fill="#2C1810"/>
    <!-- Tail feathers -->
    <path d="M-4,1 L-8,3 L-7,0 Z" fill="#B8954F"/>
    <path d="M-4,2 L-9,5 L-7,1 Z" fill="#C9A96E" opacity="0.8"/>
  </g>
</svg>

  <!-- Talons — gold -->
  <path d="M26,50 L24,56 L26,55 L28,57 L29,54 L28,50 Z" fill="#D4A030"/>
  <path d="M38,50 L40,56 L38,55 L36,57 L35,54 L36,50 Z" fill="#D4A030"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="191" viewBox="0 0 1128 191">
  <defs>
    <!-- Subtle gradient background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2C1810"/>
      <stop offset="60%" stop-color="#2C1810"/>
      <stop offset="100%" stop-color="#3A2519"/>
    </linearGradient>
    <!-- Gold accent line gradient -->
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="20%" stop-color="#C9A96E" stop-opacity="1"/>
      <stop offset="80%" stop-color="#D4A030" stop-opacity="1"/>
      <stop offset="100%" stop-color="#D4A030" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1128" height="191" fill="url(#bg)"/>

  <!-- Subtle gold accent line at bottom -->
  <rect x="80" y="178" width="968" height="2" fill="url(#gold-line)" rx="1"/>

  <!-- Company name — centered -->
  <text x="564" y="82" font-family="Georgia, 'DM Serif Display', serif" font-size="56" font-weight="700" fill="#FAF6F0" letter-spacing="3" text-anchor="middle">Claudje</text>

  <!-- Tagline — centered -->
  <text x="564" y="118" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#C9A96E" letter-spacing="1" text-anchor="middle">Competitor Intelligence, Delivered</text>

  <!-- Decorative dots — centered -->
  <circle cx="554" cy="145" r="2" fill="#C9A96E" opacity="0.5"/>
  <circle cx="564" cy="145" r="2" fill="#C9A96E" opacity="0.35"/>
  <circle cx="574" cy="145" r="2" fill="#C9A96E" opacity="0.2"/>
</svg>
